# A mobile monorepo: one repository, four products, cloned once per product.
# Each clone may only write inside the paths its owner claims.

wiki:
  root: docs/wiki
  profiles: [technical]
  path_citations: citation

tracker:
  backend: linear

taskflow:
  enabled: true

house_rules: docs/house-rules.md

generated_paths:
  - "apps/*/ios/**"
  - "apps/*/android/**"
  - "**/expo-env.d.ts"
  - "**/.expo/types/router.d.ts"

owners:
  # "everything not owned by another clone" is a complement, which no union
  # of globs can state. default: true is how it is expressed.
  main:
    paths:
      [packages/ui, apps/ui-showcase, web, docs/wiki, docs/specs, scripts]
    shared: true
    default: true
  notes:
    paths:
      [
        apps/notes-app,
        "packages/notes-*",
        docs/notes-app,
      ]
  quiz-arcade:
    paths:
      [
        apps/quiz,
        apps/arcade,
        # A brace list, which is how the source repo's ownership table names
        # three packages that share no prefix.
        "packages/{taxonomy,analysis,persistence}",
        docs/quiz,
        docs/arcade,
      ]
  portal:
    paths: [backend/portal, docs/portal]
